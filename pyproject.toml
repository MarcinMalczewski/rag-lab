[project]
name = "rag-lab"
version = "0.1.0"
description = "A lab for reproducible RAG experiments."
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12,<1.13",
]

[project.optional-dependencies]
hf = [
    "torch>=2.4",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
raglab = "rag_lab.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "hf" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
